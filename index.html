<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家系資金">
<title>家系資金やりくり</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fff;--bg2:#f7f7f5;--bg3:#f2f2ef;
  --text:#1a1a18;--text2:#6b6b68;--text3:#9b9b98;
  --border:#e0e0dc;--border2:#ccccc8;
  --blue-bg:#e8f2fd;--blue:#1a6fc4;--blue-text:#0d4a8a;
  --green-bg:#e6f4ec;--green:#1a8a4a;--green-text:#0a5a2e;
  --red-bg:#fdecea;--red:#c43030;--red-text:#8a0d0d;
  --orange-bg:#fef3e8;--orange:#c47020;--orange-text:#8a4a00;
  --purple-bg:#f0ecfd;--purple:#6a3ac4;--purple-text:#3a0d8a;
  --radius:10px;--radius-lg:14px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
    --text:#f2f2f0;--text2:#aeaead;--text3:#6e6e6c;
    --border:#3a3a3c;--border2:#4a4a4c;
    --blue-bg:#0d2a4a;--blue:#4a9de8;--blue-text:#7bc0f8;
    --green-bg:#0a2e1a;--green:#4aad6a;--green-text:#7be0a0;
    --red-bg:#2e0f0f;--red:#e86060;--red-text:#f8a0a0;
    --orange-bg:#2e1a0a;--orange:#e89040;--orange-text:#f8c080;
    --purple-bg:#1a0a2e;--purple:#9a6ae8;--purple-text:#c0a0f8;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;background:var(--bg3);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh}
.app{max-width:430px;margin:0 auto;background:var(--bg3);min-height:100vh;padding-bottom:84px}
/* タブバー */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);border-top:0.5px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;padding:10px 4px 8px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text3);transition:color .15s}
.tab-btn.active{color:var(--blue)}
.tab-icon{font-size:22px;line-height:1}
/* ページ */
.page{display:none;padding:0 0 16px}
.page.active{display:block}
/* ヘッダー */
.page-header{padding:16px 16px 8px}
.page-header h1{font-size:22px;font-weight:600}
.page-header .sub{font-size:13px;color:var(--text2);margin-top:2px}
/* セクションラベル */
.sec-label{font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;padding:12px 16px 6px}
/* カード */
.card{background:var(--bg);border-radius:var(--radius-lg);margin:0 16px 2px;overflow:hidden}
/* メトリクスグリッド */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin:0 16px 2px}
.metric{background:var(--bg);padding:14px 16px}
.metric:first-child{border-radius:var(--radius-lg) 0 0 var(--radius-lg)}
.metric:last-child{border-radius:0 var(--radius-lg) var(--radius-lg) 0}
.metric.full{border-radius:var(--radius-lg);grid-column:1/-1}
.metric-label{font-size:12px;color:var(--text2);margin-bottom:4px}
.metric-value{font-size:22px;font-weight:600}
.metric-value.plus{color:var(--green)}
.metric-value.minus{color:var(--red)}
/* ハイライトバナー */
.banner{border-radius:var(--radius-lg);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin:0 16px 2px}
.banner-green{background:var(--green-bg)}
.banner-blue{background:var(--blue-bg)}
.banner-orange{background:var(--orange-bg)}
.banner-purple{background:var(--purple-bg)}
.banner .label{font-size:14px;display:flex;align-items:center;gap:6px}
.banner-green .label{color:var(--green-text)}
.banner-blue .label{color:var(--blue-text)}
.banner-orange .label{color:var(--orange-text)}
.banner-purple .label{color:var(--purple-text)}
.banner .value{font-size:18px;font-weight:600}
.banner-green .value{color:var(--green-text)}
.banner-blue .value{color:var(--blue-text)}
.banner-orange .value{color:var(--orange-text)}
.banner-purple .value{color:var(--purple-text)}
/* リスト行 */
.list-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:0.5px solid var(--border)}
.list-row:last-child{border-bottom:none}
.list-row .row-main{font-size:14px;font-weight:500}
.list-row .row-sub{font-size:12px;color:var(--text3);margin-top:1px}
.list-row .row-label{font-size:14px;color:var(--text2)}
.list-row .row-value{font-size:14px;font-weight:500}
/* 入力行 */
.input-row{display:flex;align-items:center;padding:10px 16px;border-bottom:0.5px solid var(--border);gap:10px}
.input-row:last-child{border-bottom:none}
.input-row .row-label{font-size:14px;flex:1}
.input-row .row-sub{font-size:11px;color:var(--text3)}
.currency{display:flex;align-items:center;gap:4px;color:var(--text2);font-size:14px}
.currency input{width:120px;text-align:right;font-size:15px;font-weight:500;border:none;background:none;color:var(--text);outline:none;padding:0}
/* フォーム */
.form-group{padding:12px 16px;border-bottom:0.5px solid var(--border)}
.form-group:last-child{border-bottom:none}
.form-label{font-size:12px;color:var(--text2);margin-bottom:6px;display:block}
.form-input{width:100%;padding:10px 12px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-size:14px;outline:none;-webkit-appearance:none;appearance:none}
.form-input:focus{border-color:var(--blue)}
.form-row{display:flex;gap:0}
.form-row .form-group{flex:1}
/* ボタン */
.btn{padding:12px 16px;border:0.5px solid var(--border2);border-radius:var(--radius-lg);background:none;color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;transition:opacity .15s}
.btn:active{opacity:.7}
.btn-primary{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-text);font-weight:500}
.btn-danger{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.btn-icon{background:none;border:0.5px solid var(--border);border-radius:8px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:16px;flex-shrink:0}
.btn-icon.del{color:var(--red);border-color:transparent}
/* 追加フォームセクション */
.add-section{margin:2px 16px;border:0.5px dashed var(--border2);border-radius:var(--radius-lg);overflow:hidden}
.add-toggle{padding:12px 16px;background:var(--blue-bg);border:none;cursor:pointer;width:100%;text-align:left;display:flex;align-items:center;gap:8px;color:var(--blue-text);font-size:13px;font-weight:500}
.add-form{display:none;background:var(--bg)}
.add-form.open{display:block}
/* プログレスバー */
.progress-bar{height:5px;background:var(--bg3);border-radius:3px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:var(--green)}
/* 月選択 */
.month-nav{display:flex;align-items:center;gap:8px;padding:4px 0 0}
.month-nav button{background:none;border:0.5px solid var(--border);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center}
.month-nav span{flex:1;text-align:center;font-weight:500;font-size:15px}
/* 空状態 */
.empty{padding:20px 16px;text-align:center;color:var(--text3);font-size:13px}
/* 予定出費バッジ */
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;font-weight:500;margin-left:6px}
.badge-orange{background:var(--orange-bg);color:var(--orange-text)}
.badge-red{background:var(--red-bg);color:var(--red-text)}
.badge-gray{background:var(--bg3);color:var(--text2)}
/* カード内の小見出し */
.card-head{padding:12px 16px 0;font-size:13px;font-weight:500;color:var(--text2);border-bottom:0.5px solid var(--border);padding-bottom:10px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="app">

<!-- ===== ホーム ===== -->
<div class="page active" id="page-home">
  <div class="page-header">
    <h1>家系資金やりくり</h1>
    <div class="sub" id="home-month"></div>
  </div>

  <div class="sec-label">今月の収支</div>
  <div class="metrics" id="home-metrics"></div>

  <div class="sec-label">📌 資金移動の指示</div>
  <div id="home-moves"></div>

  <div class="sec-label">📅 今後の予定出費</div>
  <div id="home-upcoming"></div>

  <div class="sec-label">🏦 貯蓄目標</div>
  <div class="section" id="home-goals" style="padding:0 16px"></div>
</div>

<!-- ===== 今月入力 ===== -->
<div class="page" id="page-monthly">
  <div class="page-header">
    <h1>今月の入力</h1>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="monthly-month"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <div class="sec-label">収入</div>
  <div class="card" id="income-inputs"></div>

  <div class="sec-label">クレジットカード請求額</div>
  <div class="card" id="card-inputs"></div>

  <div class="sec-label">変動支出（今月のみ）</div>
  <div class="card" id="variable-inputs"></div>
  <div style="padding:6px 16px">
    <div style="display:flex;gap:8px">
      <input class="form-input" id="new-var-name" placeholder="項目名（食費・日用品など）" style="flex:1">
      <input class="form-input" id="new-var-amount" type="number" inputmode="numeric" placeholder="金額" style="width:90px">
      <button class="btn-icon" onclick="addVariable()" style="width:40px;height:40px;border-radius:var(--radius);font-size:20px">＋</button>
    </div>
  </div>
</div>

<!-- ===== 設定 ===== -->
<div class="page" id="page-settings">
  <div class="page-header"><h1>設定</h1></div>

  <div class="sec-label">口座</div>
  <div class="card" id="accounts-list"></div>
  <div class="add-section">
    <button class="add-toggle" onclick="toggleForm('form-account')">＋ 口座を追加</button>
    <div class="add-form" id="form-account">
      <div class="form-group"><label class="form-label">口座名</label><input class="form-input" id="new-acc-name" placeholder="例：給与口座（三菱UFJ）"></div>
      <div class="form-group"><label class="form-label">役割</label>
        <select class="form-input" id="new-acc-role">
          <option value="salary">給与入金口座（メイン）</option>
          <option value="savings">楽天銀行（残額移動先）</option>
          <option value="withdrawal">引き落とし口座</option>
        </select>
      </div>
      <div class="form-group"><button class="btn btn-primary" onclick="addAccount()">追加する</button></div>
    </div>
  </div>

  <div class="sec-label">クレジットカード</div>
  <div class="card" id="cards-list"></div>
  <div class="add-section">
    <button class="add-toggle" onclick="toggleForm('form-card')">＋ カードを追加</button>
    <div class="add-form" id="form-card">
      <div class="form-group"><label class="form-label">カード名</label><input class="form-input" id="new-card-name" placeholder="例：楽天カード"></div>
      <div class="form-group"><label class="form-label">引き落とし口座</label><select class="form-input" id="new-card-acc"></select></div>
      <div class="form-group"><button class="btn btn-primary" onclick="addCard()">追加する</button></div>
    </div>
  </div>

  <div class="sec-label">固定費（毎月自動集計）</div>
  <div class="card" id="fixed-list"></div>
  <div class="add-section">
    <button class="add-toggle" onclick="toggleForm('form-fixed')">＋ 固定費を追加</button>
    <div class="add-form" id="form-fixed">
      <div class="form-group"><label class="form-label">項目名</label><input class="form-input" id="new-fixed-name" placeholder="例：家賃、保険、サブスク"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">金額（円）</label><input class="form-input" id="new-fixed-amount" type="number" inputmode="numeric" placeholder="0"></div>
        <div class="form-group"><label class="form-label">引き落とし先</label><select class="form-input" id="new-fixed-acc"></select></div>
      </div>
      <div class="form-group"><button class="btn btn-primary" onclick="addFixed()">追加する</button></div>
    </div>
  </div>

  <div class="sec-label">今後の予定出費</div>
  <div class="card" id="upcoming-list"></div>
  <div class="add-section">
    <button class="add-toggle" onclick="toggleForm('form-upcoming')">＋ 予定出費を追加</button>
    <div class="add-form" id="form-upcoming">
      <div class="form-group"><label class="form-label">項目名</label><input class="form-input" id="new-up-name" placeholder="例：車検、家電買い替え、旅行"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">金額（円）</label><input class="form-input" id="new-up-amount" type="number" inputmode="numeric" placeholder="0"></div>
        <div class="form-group"><label class="form-label">予定年月</label><input class="form-input" id="new-up-date" type="month"></div>
      </div>
      <div class="form-group"><label class="form-label">メモ（任意）</label><input class="form-input" id="new-up-memo" placeholder="例：タイヤ交換含む"></div>
      <div class="form-group"><button class="btn btn-primary" onclick="addUpcoming()">追加する</button></div>
    </div>
  </div>

  <div class="sec-label">貯蓄目標</div>
  <div class="card" id="goals-list"></div>
  <div class="add-section">
    <button class="add-toggle" onclick="toggleForm('form-goal')">＋ 目標を追加</button>
    <div class="add-form" id="form-goal">
      <div class="form-group"><label class="form-label">目標名</label><input class="form-input" id="new-goal-name" placeholder="例：教育費、旅行、緊急予備費"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">目標金額（円）</label><input class="form-input" id="new-goal-target" type="number" inputmode="numeric" placeholder="0"></div>
        <div class="form-group"><label class="form-label">現在の貯蓄額（円）</label><input class="form-input" id="new-goal-current" type="number" inputmode="numeric" placeholder="0"></div>
      </div>
      <div class="form-group"><label class="form-label">達成まで（ヶ月）</label><input class="form-input" id="new-goal-months" type="number" inputmode="numeric" placeholder="例：24"></div>
      <div class="form-group"><button class="btn btn-primary" onclick="addGoal()">追加する</button></div>
    </div>
  </div>

  <div style="padding:16px 16px 8px">
    <button class="btn" onclick="exportData()" style="margin-bottom:8px">📤 データをエクスポート（バックアップ）</button>
    <button class="btn btn-danger" onclick="resetData()">データをリセット</button>
  </div>
  <div style="height:8px"></div>
</div>

</div><!-- .app -->

<!-- タブバー -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="showPage('home',this)"><span class="tab-icon">🏠</span>ホーム</button>
  <button class="tab-btn" onclick="showPage('monthly',this)"><span class="tab-icon">✏️</span>今月入力</button>
  <button class="tab-btn" onclick="showPage('settings',this)"><span class="tab-icon">⚙️</span>設定</button>
</div>

<script>
// ============================
// 状態管理
// ============================
let Y = new Date().getFullYear();
let M = new Date().getMonth() + 1;

let S = JSON.parse(localStorage.getItem('kasei_v3') || 'null') || {
  accounts:[
    {id:'a1',name:'給与口座',role:'salary'},
    {id:'a2',name:'楽天銀行',role:'savings'},
    {id:'a3',name:'引き落とし口座A',role:'withdrawal'}
  ],
  cards:[
    {id:'c1',name:'楽天カード',accountId:'a3'},
    {id:'c2',name:'イオンカード',accountId:'a3'}
  ],
  fixed:[
    {id:'f1',name:'家賃',amount:80000,accountId:'a3'},
    {id:'f2',name:'保険',amount:15000,accountId:'a3'}
  ],
  upcoming:[
    {id:'u1',name:'車検',amount:120000,date:'2026-09',memo:'タイヤ交換含む'},
    {id:'u2',name:'旅行（夏）',amount:80000,date:'2026-08',memo:''}
  ],
  goals:[
    {id:'g1',name:'教育費',target:3000000,current:500000,months:120},
    {id:'g2',name:'緊急予備費',target:1000000,current:200000,months:24}
  ],
  monthly:{}
};

const save = () => localStorage.setItem('kasei_v3', JSON.stringify(S));
const fmt = n => Math.round(n).toLocaleString('ja-JP');
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const mkey = (y,m) => `${y}-${String(m).padStart(2,'0')}`;
const accName = id => (S.accounts.find(a=>a.id===id)||{name:'不明'}).name;

function getMD(y, m) {
  const k = mkey(y, m);
  if (!S.monthly[k]) S.monthly[k] = {
    income:[{id:'i1',name:'夫給与',amount:0},{id:'i2',name:'妻給与',amount:0}],
    cards: S.cards.map(c=>({id:c.id,amount:0})),
    variable:[]
  };
  // 新しいカードをマージ
  S.cards.forEach(c => {
    if (!S.monthly[k].cards.find(x=>x.id===c.id))
      S.monthly[k].cards.push({id:c.id,amount:0});
  });
  return S.monthly[k];
}

// ============================
// ページ切り替え
// ============================
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
  render();
}
function changeMonth(d) {
  M += d;
  if (M>12){M=1;Y++;}
  if (M<1){M=12;Y--;}
  render();
}
function toggleForm(id) {
  document.getElementById(id).classList.toggle('open');
}

// ============================
// レンダリング
// ============================
function render() {
  renderHome();
  renderMonthly();
  renderSettings();
}

// --- ホーム ---
function renderHome() {
  const md = getMD(Y, M);
  document.getElementById('home-month').textContent = `${Y}年${M}月`;

  const totalIncome = md.income.reduce((s,i)=>s+Number(i.amount||0), 0);
  const totalFixed  = S.fixed.reduce((s,f)=>s+Number(f.amount||0), 0);
  const totalCards  = md.cards.reduce((s,c)=>s+Number(c.amount||0), 0);
  const totalVar    = md.variable.reduce((s,v)=>s+Number(v.amount||0), 0);
  const totalOut    = totalFixed + totalCards + totalVar;
  const balance     = totalIncome - totalOut;

  // 収支メトリクス
  document.getElementById('home-metrics').innerHTML = `
    <div class="metric"><div class="metric-label">今月の収入</div><div class="metric-value">¥${fmt(totalIncome)}</div></div>
    <div class="metric"><div class="metric-label">支出合計</div><div class="metric-value">¥${fmt(totalOut)}</div></div>
    <div class="metric full" style="border-radius:var(--radius-lg)">
      <div class="metric-label">残高</div>
      <div class="metric-value ${balance>=0?'plus':'minus'}">¥${fmt(balance)}</div>
    </div>`;

  // 資金移動
  let movesHtml = '';
  const salaryAcc  = S.accounts.find(a=>a.role==='salary');
  const savingsAcc = S.accounts.find(a=>a.role==='savings');

  if (salaryAcc && savingsAcc) {
    // 給与口座から引き落とされるもの
    const fixedOnSalary = S.fixed.filter(f=>f.accountId===salaryAcc.id).reduce((s,f)=>s+Number(f.amount),0);
    const cardsOnSalary = S.cards.filter(c=>c.accountId===salaryAcc.id)
      .map(c=>md.cards.find(x=>x.id===c.id)).reduce((s,c)=>s+Number(c?.amount||0),0);
    const salaryKeep = fixedOnSalary + cardsOnSalary;
    const toSavings  = Math.max(0, totalIncome - salaryKeep);

    movesHtml += `
      <div class="banner banner-blue">
        <span class="label">🏦 ${salaryAcc.name}に残す</span>
        <span class="value">¥${fmt(salaryKeep)}</span>
      </div>
      <div class="banner banner-green">
        <span class="label">→ ${savingsAcc.name}へ移動</span>
        <span class="value">¥${fmt(toSavings)}</span>
      </div>`;

    // 楽天銀行からの引き落とし（savingsAccから引き落とされるもの）
    const fixedOnSavings = S.fixed.filter(f=>f.accountId===savingsAcc.id).reduce((s,f)=>s+Number(f.amount),0);
    const cardsOnSavings = S.cards.filter(c=>c.accountId===savingsAcc.id)
      .map(c=>md.cards.find(x=>x.id===c.id)).reduce((s,c)=>s+Number(c?.amount||0),0);
    const savingsOut = fixedOnSavings + cardsOnSavings;

    if (savingsOut > 0) {
      movesHtml += `<div class="card" style="margin:0 16px 2px">
        <div class="card-head"><span>💳 ${savingsAcc.name}からの引き落とし</span><span style="font-size:15px;font-weight:600;color:var(--red-text)">¥${fmt(savingsOut)}</span></div>`;
      S.fixed.filter(f=>f.accountId===savingsAcc.id).forEach(f=>{
        movesHtml += `<div class="list-row"><span class="row-label">${f.name}（固定費）</span><span class="row-value">¥${fmt(f.amount)}</span></div>`;
      });
      S.cards.filter(c=>c.accountId===savingsAcc.id).forEach(c=>{
        const cm = md.cards.find(x=>x.id===c.id);
        movesHtml += `<div class="list-row"><span class="row-label">${c.name}</span><span class="row-value">¥${fmt(cm?.amount||0)}</span></div>`;
      });
      movesHtml += `</div>`;
    }
  }

  // 引き落とし口座ごとの入金指示
  S.accounts.filter(a=>a.role==='withdrawal').forEach(acc=>{
    const fixedSum = S.fixed.filter(f=>f.accountId===acc.id).reduce((s,f)=>s+Number(f.amount),0);
    const cardSum  = S.cards.filter(c=>c.accountId===acc.id)
      .map(c=>md.cards.find(x=>x.id===c.id)).reduce((s,c)=>s+Number(c?.amount||0),0);
    const total = fixedSum + cardSum;
    if (total > 0) {
      movesHtml += `<div class="card" style="margin:0 16px 2px">
        <div class="card-head"><span>💰 ${acc.name}に入金する</span><span style="font-size:15px;font-weight:600;color:var(--blue-text)">¥${fmt(total)}</span></div>`;
      S.fixed.filter(f=>f.accountId===acc.id).forEach(f=>{
        movesHtml += `<div class="list-row"><span class="row-label">${f.name}（固定費）</span><span class="row-value">¥${fmt(f.amount)}</span></div>`;
      });
      S.cards.filter(c=>c.accountId===acc.id).forEach(c=>{
        const cm = md.cards.find(x=>x.id===c.id);
        movesHtml += `<div class="list-row"><span class="row-label">${c.name}</span><span class="row-value">¥${fmt(cm?.amount||0)}</span></div>`;
      });
      movesHtml += `</div>`;
    }
  });

  document.getElementById('home-moves').innerHTML = movesHtml ||
    '<div class="empty">設定タブで口座・固定費を登録してください</div>';

  // 予定出費
  const now = new Date();
  const nowKey = mkey(now.getFullYear(), now.getMonth()+1);

  // 今後6ヶ月以内と7〜12ヶ月を分けて表示
  const sorted = [...S.upcoming].sort((a,b)=>a.date.localeCompare(b.date));

  // 何ヶ月先か計算
  function monthsAway(dateStr) {
    const [dy, dm] = dateStr.split('-').map(Number);
    return (dy - now.getFullYear()) * 12 + (dm - (now.getMonth()+1));
  }

  const near   = sorted.filter(u => { const d=monthsAway(u.date); return d>=0 && d<=6; });
  const future = sorted.filter(u => { const d=monthsAway(u.date); return d>6; });
  const past   = sorted.filter(u => monthsAway(u.date) < 0);

  let upHtml = '';

  if (near.length > 0) {
    upHtml += `<div class="sec-label" style="padding-top:4px">⚠️ 6ヶ月以内</div><div class="card" style="margin:0 16px 2px">`;
    near.forEach(u => {
      const ma = monthsAway(u.date);
      const badgeClass = ma <= 1 ? 'badge-red' : ma <= 3 ? 'badge-orange' : 'badge-gray';
      const badgeText  = ma === 0 ? '今月' : ma === 1 ? '来月' : `${ma}ヶ月後`;
      upHtml += `<div class="list-row">
        <div>
          <div class="row-main">${u.name}<span class="badge ${badgeClass}">${badgeText}</span></div>
          ${u.memo?`<div class="row-sub">${u.memo}</div>`:''}
          <div class="row-sub">${u.date.replace('-','年')}月</div>
        </div>
        <div class="row-value" style="color:var(--orange-text)">¥${fmt(u.amount)}</div>
      </div>`;
    });
    upHtml += `</div>`;
  }

  if (future.length > 0) {
    upHtml += `<div class="sec-label" style="padding-top:4px">📌 7ヶ月以降の予定</div><div class="card" style="margin:0 16px 2px">`;
    future.forEach(u => {
      const ma = monthsAway(u.date);
      upHtml += `<div class="list-row">
        <div>
          <div class="row-main">${u.name}<span class="badge badge-gray">${ma}ヶ月後</span></div>
          ${u.memo?`<div class="row-sub">${u.memo}</div>`:''}
          <div class="row-sub">${u.date.replace('-','年')}月</div>
        </div>
        <div class="row-value">¥${fmt(u.amount)}</div>
      </div>`;
    });
    upHtml += `</div>`;
  }

  if (near.length === 0 && future.length === 0) {
    upHtml = '<div class="empty">設定タブで予定出費を登録してください</div>';
  }

  document.getElementById('home-upcoming').innerHTML = upHtml;

  // 貯蓄目標
  let goalsHtml = '';
  S.goals.forEach(g => {
    const pct = Math.min(100, Math.round(g.current/g.target*100));
    const monthly = g.months>0 ? Math.ceil((g.target-g.current)/g.months) : 0;
    goalsHtml += `<div class="card" style="margin-bottom:8px">
      <div style="padding:14px 16px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
          <span style="font-weight:500">${g.name}</span>
          <span style="font-size:12px;color:var(--text2)">${pct}%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--text2)">
          <span>¥${fmt(g.current)} / ¥${fmt(g.target)}</span>
          <span>月¥${fmt(monthly)} × ${g.months}ヶ月</span>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('home-goals').innerHTML = goalsHtml ||
    '<div class="empty">設定タブで貯蓄目標を登録してください</div>';
}

// --- 今月入力 ---
function renderMonthly() {
  const md = getMD(Y, M);
  document.getElementById('monthly-month').textContent = `${Y}年${M}月`;

  // 収入
  let incHtml = '';
  md.income.forEach(i => {
    incHtml += `<div class="input-row">
      <div style="flex:1"><div class="row-label">${i.name}</div></div>
      <div class="currency">¥<input type="number" inputmode="numeric" value="${i.amount||''}" placeholder="0" onchange="updateIncome('${i.id}',this.value)"></div>
      <button class="btn-icon del" onclick="removeIncome('${i.id}')">×</button>
    </div>`;
  });
  incHtml += `<div class="input-row" style="gap:8px">
    <input class="form-input" id="new-inc-name" placeholder="収入項目を追加" style="flex:1">
    <button class="btn-icon" onclick="addIncome()" style="width:40px;height:40px;border-radius:var(--radius);font-size:20px">＋</button>
  </div>`;
  document.getElementById('income-inputs').innerHTML = incHtml;

  // カード
  let cardHtml = '';
  S.cards.forEach(c => {
    const cm = md.cards.find(x=>x.id===c.id) || {amount:0};
    cardHtml += `<div class="input-row">
      <div style="flex:1">
        <div class="row-label">${c.name}</div>
        <div class="row-sub">${accName(c.accountId)}引き落とし</div>
      </div>
      <div class="currency">¥<input type="number" inputmode="numeric" value="${cm.amount||''}" placeholder="今月の請求額" onchange="updateCard('${c.id}',this.value)"></div>
    </div>`;
  });
  document.getElementById('card-inputs').innerHTML = cardHtml ||
    '<div class="empty">設定タブでカードを登録してください</div>';

  // 変動支出
  let varHtml = '';
  md.variable.forEach(v => {
    varHtml += `<div class="input-row">
      <div style="flex:1"><div class="row-label">${v.name}</div></div>
      <div class="currency">¥<input type="number" inputmode="numeric" value="${v.amount||''}" placeholder="0" onchange="updateVar('${v.id}',this.value)"></div>
      <button class="btn-icon del" onclick="removeVar('${v.id}')">×</button>
    </div>`;
  });
  document.getElementById('variable-inputs').innerHTML = varHtml ||
    '<div class="empty">下のフォームから追加できます</div>';
}

// --- 設定 ---
function renderSettings() {
  // 口座
  let aHtml = '';
  S.accounts.forEach(a => {
    const lbl = {salary:'給与入金口座',savings:'楽天銀行（残額移動先）',withdrawal:'引き落とし口座'}[a.role]||a.role;
    aHtml += `<div class="list-row">
      <div><div class="row-main">${a.name}</div><div class="row-sub">${lbl}</div></div>
      <button class="btn-icon del" onclick="removeAccount('${a.id}')">×</button>
    </div>`;
  });
  document.getElementById('accounts-list').innerHTML = aHtml || '<div class="empty">口座が未登録です</div>';

  // セレクト更新
  const accOpts = S.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
  ['new-card-acc','new-fixed-acc'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.innerHTML=accOpts;
  });

  // カード
  let cHtml = '';
  S.cards.forEach(c=>{
    cHtml += `<div class="list-row">
      <div><div class="row-main">${c.name}</div><div class="row-sub">${accName(c.accountId)}引き落とし</div></div>
      <button class="btn-icon del" onclick="removeCard('${c.id}')">×</button>
    </div>`;
  });
  document.getElementById('cards-list').innerHTML = cHtml || '<div class="empty">カードが未登録です</div>';

  // 固定費
  let fHtml = '';
  S.fixed.forEach(f=>{
    fHtml += `<div class="list-row">
      <div><div class="row-main">${f.name}</div><div class="row-sub">¥${fmt(f.amount)} / ${accName(f.accountId)}</div></div>
      <button class="btn-icon del" onclick="removeFixed('${f.id}')">×</button>
    </div>`;
  });
  document.getElementById('fixed-list').innerHTML = fHtml || '<div class="empty">固定費が未登録です</div>';

  // 予定出費
  const now = new Date();
  let uHtml = '';
  [...S.upcoming].sort((a,b)=>a.date.localeCompare(b.date)).forEach(u=>{
    const [dy,dm]=u.date.split('-').map(Number);
    const ma=(dy-now.getFullYear())*12+(dm-(now.getMonth()+1));
    const isPast = ma < 0;
    uHtml += `<div class="list-row" style="${isPast?'opacity:.5':''}">
      <div style="flex:1">
        <div class="row-main">${u.name} ${isPast?'<span class="badge badge-gray">過去</span>':''}</div>
        <div class="row-sub">${u.date.replace('-','年')}月${u.memo?' · '+u.memo:''}</div>
      </div>
      <div style="text-align:right;margin-right:8px">
        <div class="row-value">¥${fmt(u.amount)}</div>
      </div>
      <button class="btn-icon del" onclick="removeUpcoming('${u.id}')">×</button>
    </div>`;
  });
  document.getElementById('upcoming-list').innerHTML = uHtml || '<div class="empty">予定出費が未登録です</div>';

  // 貯蓄目標
  let gHtml = '';
  S.goals.forEach(g=>{
    const pct=Math.min(100,Math.round(g.current/g.target*100));
    gHtml += `<div class="list-row">
      <div style="flex:1">
        <div class="row-main">${g.name}</div>
        <div class="row-sub">¥${fmt(g.current)}/¥${fmt(g.target)}（${pct}%）</div>
        <div class="progress-bar" style="margin-top:6px"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <button class="btn-icon del" style="margin-left:10px" onclick="removeGoal('${g.id}')">×</button>
    </div>`;
  });
  document.getElementById('goals-list').innerHTML = gHtml || '<div class="empty">目標が未登録です</div>';
}

// ============================
// データ操作
// ============================
// 収入
function updateIncome(id,v){const md=getMD(Y,M);const i=md.income.find(x=>x.id===id);if(i){i.amount=Number(v)||0;save();renderHome();}}
function addIncome(){const n=document.getElementById('new-inc-name').value.trim();if(!n)return;getMD(Y,M).income.push({id:uid(),name:n,amount:0});save();render();document.getElementById('new-inc-name').value='';}
function removeIncome(id){const md=getMD(Y,M);md.income=md.income.filter(x=>x.id!==id);save();render();}
// カード金額
function updateCard(id,v){const md=getMD(Y,M);const c=md.cards.find(x=>x.id===id);if(c){c.amount=Number(v)||0;save();renderHome();}}
// 変動
function addVariable(){const n=document.getElementById('new-var-name').value.trim();const a=Number(document.getElementById('new-var-amount').value)||0;if(!n)return;getMD(Y,M).variable.push({id:uid(),name:n,amount:a});save();render();document.getElementById('new-var-name').value='';document.getElementById('new-var-amount').value='';}
function updateVar(id,v){const md=getMD(Y,M);const i=md.variable.find(x=>x.id===id);if(i){i.amount=Number(v)||0;save();renderHome();}}
function removeVar(id){const md=getMD(Y,M);md.variable=md.variable.filter(x=>x.id!==id);save();render();}
// 口座
function addAccount(){const n=document.getElementById('new-acc-name').value.trim();const r=document.getElementById('new-acc-role').value;if(!n)return;S.accounts.push({id:uid(),name:n,role:r});save();render();document.getElementById('new-acc-name').value='';document.getElementById('form-account').classList.remove('open');}
function removeAccount(id){if(!confirm('この口座を削除しますか？'))return;S.accounts=S.accounts.filter(x=>x.id!==id);save();render();}
// カード設定
function addCard(){const n=document.getElementById('new-card-name').value.trim();const a=document.getElementById('new-card-acc').value;if(!n)return;S.cards.push({id:uid(),name:n,accountId:a});save();render();document.getElementById('new-card-name').value='';document.getElementById('form-card').classList.remove('open');}
function removeCard(id){if(!confirm('このカードを削除しますか？'))return;S.cards=S.cards.filter(x=>x.id!==id);save();render();}
// 固定費
function addFixed(){const n=document.getElementById('new-fixed-name').value.trim();const am=Number(document.getElementById('new-fixed-amount').value)||0;const a=document.getElementById('new-fixed-acc').value;if(!n||!am){alert('項目名と金額を入力してください');return;}S.fixed.push({id:uid(),name:n,amount:am,accountId:a});save();render();document.getElementById('new-fixed-name').value='';document.getElementById('new-fixed-amount').value='';document.getElementById('form-fixed').classList.remove('open');}
function removeFixed(id){if(!confirm('この固定費を削除しますか？'))return;S.fixed=S.fixed.filter(x=>x.id!==id);save();render();}
// 予定出費
function addUpcoming(){const n=document.getElementById('new-up-name').value.trim();const am=Number(document.getElementById('new-up-amount').value)||0;const d=document.getElementById('new-up-date').value;const memo=document.getElementById('new-up-memo').value.trim();if(!n||!am||!d){alert('項目名・金額・予定年月を入力してください');return;}S.upcoming.push({id:uid(),name:n,amount:am,date:d,memo:memo});save();render();['new-up-name','new-up-amount','new-up-date','new-up-memo'].forEach(id=>document.getElementById(id).value='');document.getElementById('form-upcoming').classList.remove('open');}
function removeUpcoming(id){if(!confirm('この予定出費を削除しますか？'))return;S.upcoming=S.upcoming.filter(x=>x.id!==id);save();render();}
// 貯蓄目標
function addGoal(){const n=document.getElementById('new-goal-name').value.trim();const t=Number(document.getElementById('new-goal-target').value)||0;const c=Number(document.getElementById('new-goal-current').value)||0;const m=Number(document.getElementById('new-goal-months').value)||12;if(!n||!t){alert('目標名と目標金額を入力してください');return;}S.goals.push({id:uid(),name:n,target:t,current:c,months:m});save();render();['new-goal-name','new-goal-target','new-goal-current','new-goal-months'].forEach(id=>document.getElementById(id).value='');document.getElementById('form-goal').classList.remove('open');}
function removeGoal(id){if(!confirm('この目標を削除しますか？'))return;S.goals=S.goals.filter(x=>x.id!==id);save();render();}
// バックアップ
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`kasei-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();}
function resetData(){if(!confirm('全データをリセットしますか？この操作は取り消せません。'))return;localStorage.removeItem('kasei_v3');location.reload();}

render();
</script>
